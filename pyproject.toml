[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenetext"
version = "0.1.0"
description = "End-to-end Scene Text Recognition: YOLO26 text detection + CRNN (CTC) text recognition on ICDAR2003"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9",
  "ultralytics>=8.4.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.6"]
app = ["streamlit>=1.35"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pre-commit>=3.7"]
all = ["scenetext[serve,app,export,dev]"]

[project.scripts]
scenetext = "scenetext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: tests that need torch/timm (skipped if unavailable)"]
