detector_weights: runs/detect/train/weights/best.pt
recognizer_weights: runs/recognition/best.pt
det_conf: 0.25
det_imgsz: 640
crop_padding: 0.05     # relative padding around detected boxes
decode_mode: greedy     # greedy | beam
beam_width: 10          # number of hypotheses for beam search
